services:
  terminal:
    build:
      context: .
    image: india-terminal:coolify
    container_name: india-terminal
    restart: unless-stopped
    env_file:
      - .env.coolify
    environment:
      APP_ROLE: combined
      DASHBOARD_DB_PATH: /app/data/dashboard.db
      WATCHLIST_DB_PATH: /app/data/watchlist.db
      MUTUAL_FUND_DB_PATH: /app/data/mutual_funds.db
      RENDER_MINIMAL_MODE: "0"
      BACKGROUND_NEWS_ENABLED: "1"
      BACKGROUND_LLM_ENABLED: "1"
      LIVE_STORIES_ENABLED: "1"
      GLOBAL_STREAM_ENABLED: "1"
      MARKET_REFRESH_SECS: "60"
      GIFT_NIFTY_REFRESH_SECS: "12"
      GLOBAL_POLL_SECS: "60"
      GLOBAL_BROADCAST_MS: "1000"
      NEWS_FEED_TIMEOUT_SECS: "8"
      NEWS_FEED_WORKERS: "10"
      NEWS_REFRESH_SECS: "60"
      LIVE_STORY_POLL_SECS: "60"
      LIVE_STORY_DISCOVER_SECS: "180"
      NV_REQUESTS_PER_MINUTE: "40"
      NV_MAX_PARALLEL: "6"
      LLM_BATCH_THRESHOLD: "6"
      LLM_BATCH_SIZE: "8"
      WATCHLIST_NEWS_BACKFILL_LIMIT: "8"
      WATCHLIST_NEWS_ANALYZE_LIMIT: "8"
      WATCHLIST_NEWS_MAX_ITEMS: "8"
      WATCHLIST_PANEL_REFRESH_SYMBOL_CAP: "6"
      WATCHLIST_PANEL_SPARSE_REFRESH_SYMBOL_CAP: "10"
      WATCHLIST_PANEL_DEEP_REFRESH_SYMBOL_CAP: "18"
      WATCHLIST_REFRESH_WORKERS: "6"
    ports:
      - "18080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  mutual-funds:
    build:
      context: .
    image: india-terminal:coolify
    container_name: india-terminal-mf
    restart: unless-stopped
    depends_on:
      terminal:
        condition: service_started
    env_file:
      - .env.coolify
    environment:
      DASHBOARD_DB_PATH: /app/data/dashboard.db
      WATCHLIST_DB_PATH: /app/data/watchlist.db
      MUTUAL_FUND_DB_PATH: /app/data/mutual_funds.db
    command: ["uvicorn", "app.mutual_server:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips=*", "--timeout-keep-alive", "75", "--log-level", "info"]
    ports:
      - "18081:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
