# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → connect repo → apply.
#
# Python version: uses repo [.python-version](.python-version) (see Render native Python).
# Optional secrets (set in dashboard): NV_API_KEY, TWELVE_DATA_API_KEY, WATCHLIST_SEED_SYMBOLS, etc.

services:
  - type: web
    name: india-market-terminal
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    # --proxy-headers: correct client scheme/host behind Render TLS termination (helps WS + redirects)
    # --timeout-keep-alive: reduce idle disconnects on long-lived connections (under Render ~100s limit)
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 75 --log-level info
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ROLE
        value: "web"
      - key: DASHBOARD_READY_TIMEOUT_SECS
        value: "4"
      - key: PREWARM_TIMEOUT_SECS
        value: "75"
      - key: NEWS_FEED_TIMEOUT_SECS
        value: "4"
      - key: NEWS_FEED_WORKERS
        value: "4"
      - key: NEWS_REFRESH_SECS
        value: "90"
      - key: RENDER_GIFT_BOOT_DELAY_SECS
        value: "6"
      - key: RENDER_GLOBAL_BOOT_DELAY_SECS
        value: "12"
      - key: RENDER_LLM_BOOT_DELAY_SECS
        value: "10"
      - key: RENDER_NEWS_BOOT_DELAY_SECS
        value: "20"
      - key: RENDER_LIVE_BOOT_DELAY_SECS
        value: "45"
      - key: LIVE_STORY_POLL_SECS
        value: "180"
      - key: LIVE_STORY_DISCOVER_SECS
        value: "600"
      - key: NV_NEWS_MODEL
        value: "moonshotai/kimi-k2.5"
      - key: NV_FAST_MODEL
        value: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
      - key: DATABASE_URL
        fromDatabase:
          name: india-market-terminal-db
          property: connectionString

databases:
  - name: india-market-terminal-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
